version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: revenueai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: recoverai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recoverai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: revenueai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/recoverai
      - PAYMENT_PROVIDER=mock
      - ALLOW_REAL_MONEY_MOVEMENT=false
      - MAX_RECOVERY_RETRIES=3
      - AI_PROVIDER=${AI_PROVIDER:-generic_llm}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-openai/gpt-oss-120b}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.groq.com/openai/v1}
      - SECRET_KEY=${SECRET_KEY:-revenueai-fintech-jwt-secret-key-2026-production-ready}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost:80
      - AUTO_SEED_ON_EMPTY=true
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000/api
    container_name: revenueai-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
