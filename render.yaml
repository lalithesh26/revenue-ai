# Render Infrastructure as Code Blueprint for RevenueAI
# Deploys Managed PostgreSQL, FastAPI Backend, and React Vite Frontend

databases:
  - name: revenueai-db
    databaseName: recoverai
    user: recoverai_user
    plan: free
    region: oregon

services:
  # 1. FastAPI Backend API
  - type: web
    name: revenueai-api
    runtime: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: revenueai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: AUTO_SEED_ON_EMPTY
        value: "true"
      - key: PAYMENT_PROVIDER
        value: mock
      - key: ALLOW_REAL_MONEY_MOVEMENT
        value: "false"
      - key: MAX_RECOVERY_RETRIES
        value: "3"
      - key: AI_PROVIDER
        value: generic_llm
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: CORS_ORIGINS
        value: https://revenueai-web.onrender.com,https://revenueai.onrender.com

  # 2. React / Vite Frontend
  - type: web
    name: revenueai-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: revenueai-api
          property: host
